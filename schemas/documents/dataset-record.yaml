$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "hicel/documents/dataset-record"
title: "DatasetRecord"
type: object
required:
  - type
  - label
  - timestamp
  - metadata
  - header
  - records
properties:
  type:
    const: "DatasetRecord"
  label:
    type: string
  timestamp:
    type: string
    format: date-time
  metadata:
    $ref: ../shared/metadata.yaml
  id:
    type: string
    format: uuid
  refs:
    type: array
    items:
      type: string
      format: uuid
  header:
    $ref: ../primitives/document-header.yaml
  records:
    type: array
    items:
      $ref: ../primitives/state-slice.yaml

  attributes:
    type: object
    additionalProperties: true
patternProperties:
  "^x-": {}
additionalProperties: false
