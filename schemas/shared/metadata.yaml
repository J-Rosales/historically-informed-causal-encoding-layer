$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "hicel/shared/metadata"
title: "HICELMetadata"
type: object
required:
  - uuid
  - source
  - status
  - refs
properties:
  uuid:
    type: string
    format: uuid
  source:
    type: string
  status:
    type: string
  refs:
    type: array
    items:
      type: string
      format: uuid
  tags:
    type: array
    items:
      type: string
  notes:
    type: string
  version:
    type: string
additionalProperties: false
